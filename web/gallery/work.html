<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 艺术作品 · 敦煌 AIGC 艺术展</title>
  <!-- OG tags injected by server (/work/:id) -->
  <meta property="og:type" content="website">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--gold:#c9a96e;--gold-light:#f0dda0;--brown:#3d3020;--brown-light:#8a7a5e;--cream:#f8f4ee;--cream-dark:#efe8dc;--purple:#a855f7;--card-radius:16px;--ease-out-expo:cubic-bezier(0.16,1,0.3,1);--ease-spring:cubic-bezier(0.34,1.56,0.64,1)}
    html{scroll-behavior:smooth}
    body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--brown);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    #progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--purple));z-index:9999;width:0%;transition:width .1s linear;box-shadow:0 0 8px rgba(168,85,247,.3)}
    .page{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;padding-bottom:60px;position:relative}
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .8s var(--ease-out-expo),transform .8s var(--ease-out-expo)}
    .reveal.visible{opacity:1;transform:translateY(0)}
    .hero-entrance{animation:heroZoom 1.2s var(--ease-out-expo) forwards;opacity:0}
    @keyframes heroZoom{0%{opacity:0;transform:scale(.92);filter:blur(4px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
    .brand-header{width:100%;padding:18px 20px 14px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(201,169,110,.15);background:rgba(248,244,238,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:3px;z-index:100}
    .brand-header .logo-wrap{width:auto;height:48px;flex-shrink:0;display:flex;align-items:center}
    .brand-header .logo-wrap img{height:48px;width:auto;display:block}
    .brand-header .brand-name{font-size:16px;font-weight:700;color:var(--brown);letter-spacing:1px;line-height:1.2}
    .brand-header .brand-tagline{font-size:10.5px;color:var(--brown-light);margin-top:1px;letter-spacing:.3px}
    .share-bar{display:flex;align-items:center;gap:8px;padding:6px 20px 10px;width:100%}
    .share-bar .share-hint{font-size:11px;color:var(--brown-light);flex:1}
    .share-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(201,169,110,.15);color:var(--brown);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s ease}
    .share-btn:active{transform:scale(.9);background:rgba(201,169,110,.3)}
    .hero{width:100%;padding:8px 16px 0}
    .hero-inner{position:relative;border-radius:var(--card-radius);overflow:hidden;box-shadow:0 8px 32px rgba(74,63,48,.08),0 2px 8px rgba(74,63,48,.04);cursor:pointer}
    .hero-inner img{width:100%;display:block;transition:transform .4s ease}
    .hero-inner:active img{transform:scale(1.02)}
    .hero-badge{position:absolute;top:12px;left:12px;background:rgba(74,63,48,.65);color:var(--gold-light);font-size:11px;padding:4px 12px;border-radius:12px;letter-spacing:2px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2}
    .hero-tap-hint{position:absolute;bottom:14px;right:14px;background:rgba(74,63,48,.72);color:var(--gold-light);font-size:12px;padding:6px 14px;border-radius:18px;pointer-events:none;z-index:2;animation:bounceY 2s ease-in-out infinite;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    @keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:9998;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
    .lightbox.active{opacity:1;pointer-events:auto}
    .lightbox img{max-width:92%;max-height:88%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.9);transition:transform .4s var(--ease-out-expo)}
    .lightbox.active img{transform:scale(1)}
    .lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .lightbox-save{position:absolute;bottom:40px;padding:12px 32px;background:linear-gradient(135deg,var(--gold),#a08050);color:var(--brown);font-size:15px;font-weight:600;border:none;border-radius:24px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 16px rgba(201,169,110,.3)}
    .lightbox-save:active{transform:scale(.95)}
    .info{width:100%;padding:14px 20px 4px;text-align:center}
    .child-name{font-size:24px;font-weight:700;color:var(--brown);line-height:1.3}
    .child-name .sub{font-size:14px;font-weight:400;color:var(--brown-light)}
    .date-badge{display:inline-block;font-size:12px;color:var(--brown-light);margin-top:6px;padding:3px 14px;border:1px solid rgba(201,169,110,.4);border-radius:20px;background:rgba(201,169,110,.06)}
    .tech-tags{width:calc(100% - 40px);max-width:440px;margin:14px 20px 0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .tech-tags .tag{padding:5px 14px;border-radius:14px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;transition:transform .2s ease}
    .tech-tags .tag:active{transform:scale(.95)}
    .tech-tags .tag.purple{background:rgba(168,85,247,.08);color:var(--purple);border:1px solid rgba(168,85,247,.15)}
    .tech-tags .tag.gold{background:rgba(201,169,110,.08);color:var(--brown-light);border:1px solid rgba(201,169,110,.15)}
    .tech-tags .tag.green{background:rgba(34,197,94,.08);color:#16a34a;border:1px solid rgba(34,197,94,.15)}
    .section-divider{width:calc(100% - 60px);max-width:400px;margin:20px auto 0;display:flex;align-items:center;gap:12px}
    .section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.3),transparent)}
    .section-divider .dot{color:var(--gold);font-size:8px;opacity:.6}
    .brand-story{width:calc(100% - 40px);max-width:440px;margin:16px 20px 0;padding:20px 18px;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:var(--card-radius);text-align:center;box-shadow:0 4px 20px rgba(74,63,48,.04)}
    .brand-story .icon{font-size:26px;margin-bottom:8px;display:block}
    .brand-story h4{font-size:14px;color:var(--brown);font-weight:700;margin-bottom:8px;letter-spacing:1px}
    .brand-story p{font-size:12.5px;color:#6a5a4a;line-height:1.9;letter-spacing:.3px}
    .brand-story p em{font-style:normal;background:linear-gradient(135deg,var(--purple),#6b5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:600}
    .ai-reveal{width:calc(100% - 40px);max-width:440px;margin:14px 20px 0;padding:18px 18px 16px;background:linear-gradient(135deg,rgba(168,85,247,.04),rgba(107,92,231,.04));border:1.5px dashed rgba(168,85,247,.25);border-radius:var(--card-radius);text-align:center}
    .ai-reveal .icon{font-size:20px;margin-bottom:6px}
    .ai-reveal .title{font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--purple),#6b5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;letter-spacing:.5px}
    .ai-reveal .body{font-size:12.5px;color:#6a5a4a;line-height:1.8}
    .ai-reveal .high{color:var(--purple);font-weight:600}
    .ai-reveal .arrow{font-size:16px;color:var(--purple);margin-top:6px;display:inline-block;animation:bounceY 2s ease-in-out infinite}
    .course-cta{width:calc(100% - 40px);max-width:440px;margin:14px 20px 0;background:linear-gradient(145deg,#2d204a,#1a1a2e);border-radius:18px;padding:24px 20px 20px;text-align:center;box-shadow:0 8px 32px rgba(45,32,74,.2);position:relative;overflow:hidden}
    .course-cta .bg-glow{position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:radial-gradient(circle,rgba(168,85,247,.2),transparent 70%);border-radius:50%;pointer-events:none}
    .course-cta .bg-glow2{position:absolute;bottom:-30px;left:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(201,169,110,.1),transparent 70%);border-radius:50%;pointer-events:none}
    .course-cta .cta-badge{display:inline-block;font-size:10px;background:rgba(240,221,160,.12);color:var(--gold-light);padding:3px 12px;border-radius:10px;letter-spacing:1px;margin-bottom:10px;position:relative;z-index:1}
    .course-cta h3{font-size:17px;color:var(--gold-light);font-weight:700;margin-bottom:4px;letter-spacing:1px;position:relative;z-index:1}
    .course-cta .desc{font-size:13px;color:#b8a0e0;line-height:1.7;margin-bottom:14px;position:relative;z-index:1}
    .course-cta .feature-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;position:relative;z-index:1}
    .course-cta .feature-item{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 4px;text-align:center}
    .course-cta .feature-item .fi-icon{font-size:22px;margin-bottom:4px}
    .course-cta .feature-item .fi-label{font-size:10px;color:#b8a0e0;line-height:1.3}
    .course-cta .price-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;position:relative;z-index:1}
    .course-cta .price-current{font-size:28px;font-weight:700;color:var(--gold-light);letter-spacing:1px}
    .course-cta .price-original{font-size:14px;color:#7a6a9e;text-decoration:line-through}
    .course-cta .price-tag{font-size:10px;color:var(--gold-light);background:rgba(201,169,110,.15);padding:2px 8px;border-radius:4px}
    .course-cta .cta-btn{display:block;padding:14px 0;background:linear-gradient(135deg,#d946ef,var(--purple));color:#fff;font-size:15px;font-weight:700;border:none;border-radius:24px;cursor:pointer;text-decoration:none;text-align:center;letter-spacing:1px;box-shadow:0 4px 20px rgba(168,85,247,.3);position:relative;z-index:1;transition:transform .2s ease,box-shadow .2s ease}
    .course-cta .cta-btn:active{transform:scale(.97);box-shadow:0 2px 12px rgba(168,85,247,.2)}
    .course-cta .urgency{font-size:10.5px;color:#7a6a9e;margin-top:10px;position:relative;z-index:1}
    .course-cta .cta-qr-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
    .course-cta .cta-qr-img{width:200px;height:auto;border-radius:14px;border:2px solid rgba(240,221,160,.25);box-shadow:0 4px 24px rgba(0,0,0,.25);background:#fff;padding:8px}
    .wechat-card{width:calc(100% - 40px);max-width:440px;margin:14px 20px 0;padding:18px;background:#fff;border:1px solid rgba(224,213,197,.6);border-radius:var(--card-radius);text-align:center;box-shadow:0 2px 12px rgba(74,63,48,.04)}
    .wechat-card h4{font-size:14px;color:var(--brown);font-weight:600;margin-bottom:4px}
    .wechat-card .sub{font-size:11.5px;color:var(--brown-light);margin-bottom:12px;line-height:1.5}
    .wechat-card .qr-wrap{display:flex;justify-content:center;margin-bottom:8px}
    .wechat-card .qr-placeholder{width:120px;height:120px;background:linear-gradient(135deg,#f8f4ee,#f0e9dd);border:2px dashed rgba(201,169,110,.4);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a8946c;font-size:11px;gap:3px;line-height:1.4;transition:transform .2s ease}
    .wechat-card .qr-placeholder:active{transform:scale(.96)}
    .wechat-card .social-proof{font-size:11px;color:#a8946c;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
    .wechat-card .social-proof .counter{color:var(--purple);font-weight:700;font-size:13px}
    .footer{width:100%;padding:28px 24px 20px;margin-top:24px;border-top:1px solid rgba(224,213,197,.5);text-align:center}
    .footer .brand{font-size:14px;color:var(--brown-light);letter-spacing:3px;font-weight:600}
    .footer .sub{font-size:11px;color:#a8946c;margin-top:4px;letter-spacing:.5px}
    .footer .divider{width:40px;height:2px;background:linear-gradient(90deg,var(--gold),var(--purple));margin:8px auto;border-radius:2px}
    .footer .contact{font-size:11px;color:#b5a88a;margin-top:6px}
    #back-top{position:fixed;bottom:30px;right:20px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a08050);color:var(--brown);border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(201,169,110,.25);opacity:0;transform:translateY(20px);pointer-events:none;transition:all .3s var(--ease-out-expo);z-index:999;display:flex;align-items:center;justify-content:center}
    #back-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
    #back-top:active{transform:scale(.9)}
    .gallery-link{text-align:center;padding:16px 20px 28px;border-top:1px solid rgba(224,213,197,.5);margin-top:4px}
    .gallery-link a{color:var(--brown-light);text-decoration:none;font-size:13px;opacity:.7;transition:opacity .2s}
    .gallery-link a:hover{opacity:1}
    .gallery-link .arrow{display:inline-block;transition:transform .2s ease}
    .gallery-link a:hover .arrow{transform:translateX(-3px)}
    .course-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s ease}
    .course-modal-overlay.active{opacity:1;pointer-events:auto}
    .course-modal-box{background:linear-gradient(135deg,#fff,#faf6ef);max-width:340px;width:88%;border-radius:20px;padding:26px 18px 20px;text-align:center;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.2);transform:scale(.9);transition:transform .35s var(--ease-spring)}
    .course-modal-overlay.active .course-modal-box{transform:scale(1)}
    .course-modal-close{position:absolute;top:10px;right:14px;border:none;background:none;font-size:20px;color:#aaa;cursor:pointer;padding:4px;line-height:1}
    .loading{text-align:center;padding:60px 20px;color:var(--brown-light);font-size:14px}
    .loading .spinner{display:inline-block;width:28px;height:28px;border:3px solid rgba(201,169,110,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .not-found{text-align:center;padding:80px 20px;color:var(--brown-light);font-size:16px}
  </style>
</head>
<body>
  <div id="progress-bar"></div>
  <div id="app">
    <div class="loading"><div class="spinner"></div><br>加载中...</div>
  </div>
  <div class="course-modal-overlay" id="courseModal" onclick="document.getElementById('courseModal').classList.remove('active')">
    <div class="course-modal-box" onclick="event.stopPropagation()">
      <button class="course-modal-close" onclick="document.getElementById('courseModal').classList.remove('active')">&times;</button>
      <div style="font-size:40px;margin-bottom:8px">🎀</div>
      <h3 style="font-size:18px;color:var(--brown);margin-bottom:4px">二楼 · AI 微电影课</h3>
      <p style="font-size:13px;color:#7a6a52;margin-bottom:12px;line-height:1.6">30 分钟，让刚才创作的角色<br>变成动画短片主角！</p>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        <span style="font-size:11px;color:#7a6a52;background:rgba(201,169,110,.12);padding:4px 10px;border-radius:8px">✦ AI 角色生成</span>
        <span style="font-size:11px;color:#7a6a52;background:rgba(201,169,110,.12);padding:4px 10px;border-radius:8px">🎨 场景创作</span>
        <span style="font-size:11px;color:#7a6a52;background:rgba(201,169,110,.12);padding:4px 10px;border-radius:8px">📹 15 秒大片</span>
      </div>
      <div style="margin-bottom:14px">
        <strong style="font-size:26px;color:var(--brown)">¥125</strong>
        <s style="font-size:14px;color:#aaa;margin-left:8px">原价 ¥198</s>
      </div>
      <div style="margin-bottom:10px">
        <div style="width:120px;height:120px;background:#f8f4ee;border:2px dashed #d4c5aa;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a8946c;font-size:11px;gap:4px;margin:0 auto">
          <span style="font-size:26px">📫</span>
          <span>扫码加微信</span>
          <span style="font-size:10px">替换为实际二维码</span>
        </div>
      </div>
      <p style="font-size:11px;color:#a8946c">发送作品编号 · 优先预留名额</p>
    </div>
  </div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="" alt="作品预览">
    <button class="lightbox-save" onclick="saveImage()">保存到相册</button>
  </div>
  <button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&uarr;</button>

  <script>
    var workData = null;

    function loadData() {
      // Priority 1: Embedded data from server (/work/:id)
      if (window.__WORK_DATA__) {
        workData = window.__WORK_DATA__;
        render();
        return;
      }
      // Priority 2: Parse id from URL and fetch
      var id = getParam('id');
      if (!id) { showNotFound(); return; }
      window.__WORK_ID__ = id;
      fetch('/api/artworks?' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(list) {
          workData = list.find(function(a) { return a.id === id; });
          if (workData) { render(); return; }
          throw new Error('not found');
        })
        .catch(function() {
          // Priority 3: Fall back to static data
          fetch('data/works-data.json?' + Date.now())
            .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(function(list) {
              workData = list.find(function(a) { return a.id === id; });
              if (workData) { render(); return; }
              showNotFound();
            })
            .catch(showNotFound);
        });
    }

    function getParam(name) {
      var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    function render() {
      if (!workData) { showNotFound(); return; }
      var a = workData;
      var name = esc(a.name);
      var url = a.url;
      var dateStr = formatDate(a.date);
      var title = name + ' 的 AI 艺术作品';

      document.title = title + ' · 敦煌 AIGC 艺术展';

      document.getElementById('app').innerHTML =
        '<div class="page">'
        + '<div class="brand-header">'
        +   '<div class="logo-wrap"><img src="/logo-brand.png" alt="大象智绘 AI 科创" style="width:100%;height:100%;object-fit:contain;"></div>'
        +   '<div><div class="brand-name">大象智绘 AI 科创</div><div class="brand-tagline">20 年艺术教育 · AI 创新教育引领者</div></div>'
        + '</div>'
        + '<div class="brand-story reveal"><span class="icon">✨</span><h4>这就是 AI+艺术的魔法</h4>'
        + '<p>大象智绘 AI 科创，深耕艺术教育二十余年，融合 AI 前沿技术，<br>让孩子用想象力触碰未来。这里展出的每一幅作品，<br>都是孩子创意与 <em>AI 智能</em> 的共同杰作。</p></div>'
        + '<div class="share-bar"><span class="share-hint">分享给好友欣赏</span><button class="share-btn" onclick="sharePage()" title="分享">📱</button></div>'
        + '<div class="hero hero-entrance">'
        +   '<div class="hero-inner">'
        +     '<div class="hero-badge">✦ AI 共创</div>'
        +     '<a href="' + url + '" id="img-link"><img src="' + url + '" alt="' + name + ' 的作品" id="hero-img" x-webkit-airdrop="save"></a>'
        +     '<div class="hero-tap-hint" id="hero-hint">长按保存图片</div>'
        +     '<button onclick="saveImage()" style="margin-top:8px;width:100%;padding:10px;background:linear-gradient(135deg,#c9a96e,#a08050);border:none;border-radius:12px;color:#1a1410;font-size:14px;font-weight:600;cursor:pointer">保存图片到相册</button>'
        +   '</div>'
        + '</div>'
        + '<div class="info"><div class="child-name">' + name + '<span class="sub"> 的 AI 艺术作品</span></div><div class="date-badge">' + dateStr + '</div></div>'
        + '<div class="tech-tags"><span class="tag purple">✨ AI 文生图</span><span class="tag gold">🎨 敦煌风格</span><span class="tag green">✦ 即时生成</span></div>'
        + '<div class="section-divider"><div class="line"></div><div class="dot">✦</div><div class="line"></div></div>'
        + '<div class="ai-reveal">'

        +   '<div class="arrow">&darr;</div>'
        + '</div>'
        + '<div class="course-cta">'
        +   '<div class="bg-glow"></div><div class="bg-glow2"></div>'
        +   '<div class="cta-badge">🔥 热门体验 · 二楼专享</div>'
        +   '<h3>🔥 敦煌新生 · AI 动画创作</h3>'
        +   '<p class="desc">带孩子创造属于自己的敦煌动画<br>掌中敦煌深度体验包</p>'
        +   '<div class="feature-grid"><div class="feature-item"><div class="fi-icon">🔥</div><div class="fi-label">AIGC 敦煌微动画</div></div><div class="feature-item"><div class="fi-icon">💡</div><div class="fi-label">输入你的创意</div></div><div class="feature-item"><div class="fi-icon">🎁</div><div class="fi-label">创造敦煌角色</div></div></div>'
        +   '<p class="desc" style="font-size:12px;color:#c9a96e;margin-top:-6px;margin-bottom:18px;">让传统文化在数字世界开启新的旅程 ✦</p>'
        +   '<div class="cta-qr-wrap">'
        +     '<img src="/dunhuang-qr.png" alt="敦煌新生小程序码" class="cta-qr-img">'
        +     '<div class="urgency">长按图片识别 · 了解敦煌新生详情</div>'
        +   '</div>'
        + '</div>'
        + '<div class="section-divider"><div class="line"></div><div class="dot">✦</div><div class="line"></div></div>'
        + '<div class="brand-story" style="margin-top:20px;">'
        +   '<div class="icon" style="font-size:22px;">🏛</div><h4>关于大象艺术</h4>'
        +   '<p style="text-align:left;font-size:12px;">大象艺术和一念敦煌展方深度合作，为展览研发的《掌中敦煌·AI 动画创作》课程已同步官方小程序。课程探索"敦煌+人工智能+艺术教育"的融合模式，让千年文化以动画、影像等年轻化方式重新表达，打造面向未来青少年的数字文化研学新方向。</p>'
        +   '<div style="height:10px;"></div>'
        +   '<p style="text-align:left;font-size:12px;">· 专注为青少年提供融合全球视野的前瞻性"艺术+科技"教育<br>· 拥有自主研发的 AI 艺术创作教学体系<br>· 扎根广州的专业艺术机构 10+ 年<br>· 以画载道，承载理想</p>'
        + '</div>'
        + '<div class="wechat-card" style="margin-bottom:30px;">'
        +   '<h4>📫 了解更多艺术创作与 AI 课程</h4>'

      // Observe reveals
      var obs = new IntersectionObserver(function(es) {
        es.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: .1, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(function(e) { obs.observe(e); });

      // Init lightbox click
      document.getElementById('hero-img').addEventListener('click', function(e) {
        e.preventDefault();
        openLightbox();
      });

      // WeChat hint
      if (navigator.userAgent.toLowerCase().indexOf('micromessenger') > -1) {
        var h = document.getElementById('hero-hint');
        if (h) h.innerHTML = '长按保存图片';
      }

      // Analytics beacon
      fetch('/api/analytics/beacon?id=' + (window.__WORK_DATA__ ? window.__WORK_DATA__.id : (window.__WORK_ID__ || ''))).catch(function(){});

    function showNotFound() {
      document.getElementById('app').innerHTML = '<div class="not-found">😕 作品不存在</div>';
    }

    function openLightbox() {
      var img = document.getElementById('hero-img');
      if (!img) return;
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function saveImage() {
      var img = document.getElementById('hero-img');
      if (!img) { showToast('无法找到图片'); return; }
      window.open(img.src, '_blank');
      showToast('已在新窗口打开，长按或右键保存');
    }

    function sharePage() {
      if (navigator.share) {
        navigator.share({ title: document.title, text: '快来欣赏我用 AI 创作的敦煌风格作品！', url: window.location.href }).catch(function(){});
      } else {
        var inp = document.createElement('input');
        inp.value = window.location.href;
        document.body.appendChild(inp); inp.select();
        document.execCommand('copy'); document.body.removeChild(inp);
        showToast('链接已复制');
      }
    }

    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(61,48,32,.85);color:#f0dda0;padding:10px 22px;border-radius:22px;font-size:13px;z-index:99999;backdrop-filter:blur(8px);animation:fadeInOut 2s ease forwards';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 2000);
    }

    function formatDate(d) {
      if (!d || d.length < 8) return '';
      return d.slice(0,4) + '年' + parseInt(d.slice(4,6)) + '月' + parseInt(d.slice(6,8)) + '日';
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    // Progress bar
    window.addEventListener('scroll', function() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('progress-bar').style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    });

    // Back to top
    window.addEventListener('scroll', function() {
      var b = document.getElementById('back-top');
      if (window.scrollY > 500) b.classList.add('show'); else b.classList.remove('show');
    });

    // Keyboard close
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeLightbox(); } });

    // Toast animation
    var st = document.createElement('style');
    st.textContent = '@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}';
    document.head.appendChild(st);

    // Go!
    loadData();
  </script>
