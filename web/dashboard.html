<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板 · 一念敦煌</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f7f3ec;
      color: #3d2f1f;
      min-height: 100vh;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #d4c5a0;
    }
    .header h1 { font-size: 24px; font-weight: 700; color: #5a3e2b; }
    .header-sub { font-size: 13px; color: #a8946c; margin-left: 12px; }
    .header-left { display: flex; align-items: baseline; }
    .btn-back {
      padding: 8px 18px;
      background: #fff;
      border: 1px solid #c4a86c;
      border-radius: 6px;
      color: #8a6d3b;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #faf3e6; border-color: #8a6d3b; }

    /* 卡片样式 */
    .card {
      background: #fff;
      border: 1px solid #e8dcc8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #5a3e2b;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0e8d5;
    }

    /* 作品统计条 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat-item {
      text-align: center;
      padding: 16px 10px;
      background: #fdfaf5;
      border-radius: 8px;
      border: 1px solid #eadbc4;
    }
    .stat-num { font-size: 32px; font-weight: 800; color: #8a6d3b; line-height: 1.1; }
    .stat-label { font-size: 12px; color: #a8946c; margin-top: 6px; }

    /* 手动填写区 */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    .form-group { }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5a3e2b;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d4c5a0;
      border-radius: 8px;
      font-size: 14px;
      color: #3d2f1f;
      background: #fdfaf5;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #8a6d3b;
      background: #fff;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-save {
      padding: 10px 28px;
      background: #8a6d3b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #6b5430; }
    .save-status {
      font-size: 13px;
      color: #27ae60;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .save-status.show { opacity: 1; }

    /* 历史记录表 */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .history-table th {
      text-align: left;
      padding: 10px 12px;
      background: #faf6ee;
      color: #8a6d3b;
      font-weight: 600;
      border-bottom: 2px solid #d4c5a0;
      font-size: 12px;
    }
    .history-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0e8d5;
      color: #3d2f1f;
    }
    .history-table .highlight { font-weight: 700; color: #8a6d3b; }
    .history-table .dim { color: #a8946c; font-size: 12px; }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #c4b99a;
      font-size: 14px;
    }

    .date-label {
      display: inline-block;
      padding: 4px 10px;
      background: #faf6ee;
      border-radius: 12px;
      font-size: 13px;
      color: #8a6d3b;
      font-weight: 600;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="header-left">
        <h1>📊 数据看板</h1>
        <span class="header-sub">一念敦煌 · AIGC创作体验</span>
      </div>
      <a href="/admin" class="btn-back">← 返回上架管理</a>
    </div>

    <!-- 当日概况 -->
    <div class="card">
      <div class="card-title">📅 今日概况 <span class="date-label" id="today-label"></span></div>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-num" id="stat-active">0</div>
          <div class="stat-label">📺 上屏作品中</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">🎨 历史总作品</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="stat-today">0</div>
          <div class="stat-label">🆕 今日新增上屏</div>
        </div>
      </div>
    </div>

    <!-- 手动填写 -->
    <div class="card">
      <div class="card-title">✏️ 今日数据录入</div>
      <div class="form-row">
        <div class="form-group">
          <label>🎫 体验人次（人）</label>
          <input type="number" id="experience-visitors" value="0" min="0">
        </div>
        <div class="form-group">
          <label>👥 进群人数（人）</label>
          <input type="number" id="group-joins" value="0" min="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>💬 添加微信人数（人）</label>
          <input type="number" id="wechat-adds" value="0" min="0">
        </div>
        <div class="form-group">
          <label>🎓 二楼课程报名数（人）</label>
          <input type="number" id="course-signups" value="0" min="0">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>📝 备注</label>
        <textarea id="notes" placeholder="今日现场情况、异常、值得记录的事..."></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-save" onclick="saveToday()">💾 保存今日数据</button>
        <span class="save-status" id="save-status">✓ 已保存</span>
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
      <div class="card-title">📋 历史记录</div>
      <div id="history-area">
        <div class="empty-msg">还没有记录</div>
      </div>
    </div>
  </div>

  <script>
    // ===== 加载作品统计 =====
    function loadArtworkStats() {
      fetch('/api/artworks/stats').then(r => r.json()).then(d => {
        document.getElementById('stat-active').textContent = d.active;
        document.getElementById('stat-total').textContent = d.total;
        document.getElementById('stat-archived-count')?.remove();
      }).catch(() => {});

      // 今日新增数
      fetch('/api/analytics/today').then(r => r.json()).then(d => {
        document.getElementById('stat-today').textContent = d.today.newArtworks;
      }).catch(() => {
        document.getElementById('stat-today').textContent = '-';
      });
    }

    // ===== 加载今日手动数据 =====
    function loadTodayData() {
      fetch('/api/dashboard/today').then(r => r.json()).then(d => {
        document.getElementById('experience-visitors').value = d.experienceVisitors || 0;
        document.getElementById('group-joins').value = d.groupJoins || 0;
        document.getElementById('wechat-adds').value = d.wechatAdds || 0;
        document.getElementById('course-signups').value = d.courseSignups || 0;
        document.getElementById('notes').value = d.notes || '';
      }).catch(() => {});
    }

    // ===== 保存今日数据 =====
    function saveToday() {
      const body = {
        experienceVisitors: parseInt(document.getElementById('experience-visitors').value) || 0,
        groupJoins: parseInt(document.getElementById('group-joins').value) || 0,
        wechatAdds: parseInt(document.getElementById('wechat-adds').value) || 0,
        courseSignups: parseInt(document.getElementById('course-signups').value) || 0,
        notes: document.getElementById('notes').value.trim()
      };
      fetch('/api/dashboard/today', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(r => r.json()).then(data => {
        if (data.success) {
          const s = document.getElementById('save-status');
          s.classList.add('show');
          setTimeout(() => s.classList.remove('show'), 2000);
          loadHistory();
        }
      }).catch(() => alert('保存失败，请重试'));
    }

    // ===== 加载历史记录 =====
    function loadHistory() {
      fetch('/api/dashboard').then(r => r.json()).then(data => {
        const records = data.records;
        const area = document.getElementById('history-area');
        if (!records || records.length === 0) {
          area.innerHTML = '<div class="empty-msg">还没有记录</div>';
          return;
        }
        const rows = records.map(r => {
          const d = r.date;
          const dateStr = `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;
          const updated = r.updatedAt ? new Date(r.updatedAt).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
          return '<tr><td><strong>' + dateStr + '</strong></td>' +
            '<td class="highlight">' + (r.experienceVisitors || 0) + '</td>' +
            '<td class="highlight">' + (r.groupJoins || 0) + '</td>' +
            '<td class="highlight">' + (r.wechatAdds || 0) + '</td>' +
            '<td class="highlight">' + (r.courseSignups || 0) + '</td>' +
            '<td>' + ((r.notes || '').slice(0, 30)) + ((r.notes || '').length > 30 ? '...' : '') + '</td>' +
            '<td class="dim">' + updated + '</td>' +
          '</tr>';
        }).join('');
        area.innerHTML =
          '<table class="history-table">' +
            '<thead>' +
              '<tr><th>日期</th><th>🎫 体验人次</th><th>👥 进群人数</th><th>💬 添加微信</th><th>🎓 课程报名</th><th>📝 备注</th><th>更新时间</th></tr>' +
            '</thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>';
      }).catch(() => {});
    }

    // ===== 今日日期标签 =====
    (function() {
      const d = new Date();
      document.getElementById('today-label').textContent =
        `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    })();

    // ===== 初始化 =====
    loadArtworkStats();
    loadTodayData();
    loadHistory();
  </script>
</body>
</html>
