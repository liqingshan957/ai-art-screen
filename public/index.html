<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敦煌AI艺术展 · 大象智绘</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #1a0a0a 0%, #3d1c0a 40%, #1a0a0a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #e8d5b7; padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,213,183,0.15);
      border-radius: 16px; padding: 48px 32px; text-align: center;
      max-width: 360px; width: 100%;
      backdrop-filter: blur(10px);
    }
    .card h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: 2px; }
    .card .sub { font-size: 13px; color: #b8976e; margin-bottom: 32px; }
    .card .hint { font-size: 14px; color: #b8976e; line-height: 1.8; }
    .divider { width: 40px; height: 1px; background: #b8976e; margin: 24px auto; opacity: 0.4; }
    .footer { font-size: 11px; color: #6e5a45; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏛️ 敦煌AI艺术展</h1>
    <p class="sub">大象智绘 AI科创</p>
    <div class="divider"></div>
    <p class="hint">
      请通过工作人员发送的<br>专属作品链接查看孩子的作品
    </p>
    <div class="divider"></div>
    <p class="footer">广州美术馆 · 2026</p>
  </div>
</body>
</html>
